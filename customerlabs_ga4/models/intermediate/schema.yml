version: 2

models:

  - name: int_ga4_touchpoints
    description: >
      Event-level marketing touchpoints derived from GA4 page_view events.
      One row represents one normalized channel transition for a user within
      a GA4 session. Consecutive page views with the same normalized channel
      are collapsed into a single touchpoint.

    columns:

      - name: touchpoint_id
        description: >
          Deterministic identifier for the touchpoint based on user,
          event timestamp, and event bundle sequence.
        data_tests:
          - not_null
          - unique

      - name: event_date
        description: Date associated with the GA4 event.
        data_tests:
          - not_null

      - name: event_timestamp
        description: Timestamp of the qualifying page_view event.
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: GA4 pseudonymous user identifier.
        data_tests:
          - not_null

      - name: ga_session_id
        description: GA4 session identifier extracted from event_params.
        data_tests:
          - not_null

      - name: event_bundle_sequence_id
        description: GA4 event bundle sequence identifier used for deterministic ordering.

      - name: source
        description: >
          Event-level traffic source associated with the qualifying page_view.

      - name: medium
        description: >
          Event-level traffic medium associated with the qualifying page_view.

      - name: campaign
        description: >
          Event-level traffic campaign associated with the qualifying page_view.

      - name: channel
        description: >
          Normalized marketing channel derived from source and medium.
          Supported values include paid_search, organic_search, referral,
          direct, and other.
        data_tests:
          - not_null